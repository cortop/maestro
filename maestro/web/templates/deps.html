{% extends "base.html" %}
{% block title %}maestro dependencies{% endblock %}
{% block body %}
<section id="deps-headline" class="hero" hx-get="{{ p.url('/deps/headline') }}" hx-trigger="sse:board" hx-swap="innerHTML">
  {% include "_deps_headline.html" %}
</section>

<nav class="dep-bar" aria-label="Dependency view">
  <div class="dep-tabs">
    <a class="dep-tab{% if p.view == 'graph' %} active{% endif %}" href="{{ p.url(view='graph') }}">Graph</a>
    <a class="dep-tab{% if p.view == 'outline' %} active{% endif %}" href="{{ p.url(view='outline') }}">Outline</a>
  </div>
  <div class="dep-tools">
    <a class="dep-toggle{% if p.finished %} on{% endif %}" href="{{ p.url(finished=not p.finished) }}" aria-pressed="{{ 'true' if p.finished else 'false' }}">Finished <span>{{ n_finished }}</span></a>
    <a class="dep-toggle t-compact{% if p.compact %} on{% endif %}" href="{{ p.url(compact=not p.compact) }}" aria-pressed="{{ 'true' if p.compact else 'false' }}">Compact</a>
  </div>
</nav>

<div id="deps-main" hx-get="{{ p.url('/deps/main') }}" hx-trigger="sse:board" hx-swap="innerHTML">
  {% include "_deps_main.html" %}
</div>
{% endblock %}
