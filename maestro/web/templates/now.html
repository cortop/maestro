{% extends "base.html" %}
{% block title %}maestro now{% endblock %}
{% block body %}
<section id="now-headline" class="hero" hx-get="/now/headline" hx-trigger="sse:board" hx-swap="innerHTML">
  {% include "_now_headline.html" %}
</section>
<div class="cols">
  <section class="col now-decide" aria-labelledby="h-decide">
    <h2 id="h-decide" class="section-label gold">Decide</h2>
    <div id="now-decide" class="stack" hx-get="/now/decide" hx-trigger="sse:board" hx-swap="innerHTML">
      {% include "_now_decide.html" %}
    </div>
  </section>
  <section class="col col-wide now-ledger" aria-labelledby="h-ledger">
    <h2 id="h-ledger" class="section-label">The ledger · everything moving</h2>
    <div id="now-ledger" class="frame ledger-scroll" hx-get="/now/ledger" hx-trigger="sse:board" hx-swap="innerHTML">
      {% include "_now_ledger.html" %}
    </div>
  </section>
</div>
{% endblock %}
