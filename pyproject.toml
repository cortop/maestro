[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maestro-orchestrator"
version = "0.1.0"
description = "A per-ticket reconciler over append-only event streams — a project-agnostic, concurrent successor to wave-based markdown orchestrators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []  # stdlib-only core (tomllib, fcntl, dataclasses, argparse)

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "hypothesis>=6", "ruff>=0.6"]
tui = ["textual>=8.0"]

[project.scripts]
maestro = "maestro.cli:main"

[tool.hatch.build.targets.wheel]
# `maestro/_skill_commands/` holds symlinks into `.claude/commands/` (the
# `install-commands` verb's payload, GA-15) -- packaging "maestro" carries them
# into the wheel automatically; hatchling dereferences symlinks into real file
# content when it builds, so `importlib.resources` finds real files either way.
packages = ["maestro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# High enough that isort never wraps a long lazy import (E501 is not selected).
line-length = 400
extend-exclude = ["lab"]

[tool.ruff.lint]
# Pyflakes (unused imports/variables, redefinitions, undefined names) plus isort,
# scoped below to the hot modules whose packed imports caused merge conflicts.
select = ["F", "I"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["maestro"]
known-local-folder = ["conftest"]

[tool.ruff.lint.per-file-ignores]
# I001 applies ONLY to these files: everywhere else is ignored.
"!{maestro/dispatcher.py,maestro/cli.py,maestro/tui/app.py,maestro/tui/screens.py,tests/test_dispatcher.py}" = ["I001"]
